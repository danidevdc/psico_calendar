<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reserva de Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Reserva de Citas</h1>
            <p>Seleccione su horario preferido y complete el formulario</p>
        </header>

        <!-- Sección de horarios ocupados -->
        <section class="horarios-section">
            <h2>📅 Calendario - Horarios Ocupados</h2>
            <div id="loading-horarios" class="loading">Cargando horarios...</div>
            <div id="horarios-container" class="horarios-container"></div>
        </section>

        <!-- Formulario de reserva -->
        <section class="form-section">
            <h2>Reservar Nueva Cita</h2>

            <div id="mensaje" class="mensaje"></div>

            <form id="form-cita">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">Número de WhatsApp *</label>
                    <input type="tel" id="whatsapp" name="whatsapp"
                           placeholder="Ej: 71234567"
                           pattern="[0-9]{8}"
                           maxlength="8"
                           required>
                    <small>8 dígitos, solo números</small>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha">Fecha *</label>
                        <input type="text" id="fecha" name="fecha"
                               placeholder="DD/MM/AAAA"
                               maxlength="10"
                               required>
                        <small>Formato: DD/MM/AAAA</small>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora *</label>
                        <select id="hora" name="hora" required>
                            <option value="">Seleccione una hora</option>
                            <option value="08:00">08:00 AM</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:00">05:00 PM</option>
                            <option value="18:00">06:00 PM</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios"
                              rows="4"
                              placeholder="Información adicional que desee compartir"></textarea>
                </div>

                <button type="submit" id="btn-enviar">
                    <span class="btn-text">Reservar Cita</span>
                    <span class="btn-loader" style="display: none;">Procesando...</span>
                </button>
            </form>
        </section>
    </div>

    <footer>
        <p>Sistema de Reservas de Citas &copy; 2024</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
