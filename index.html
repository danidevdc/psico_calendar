<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reserva de Citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Reserva de Citas</h1>
            <p>Seleccione su horario preferido y complete el formulario</p>
        </header>

        <!-- Sección de horarios ocupados -->
        <section class="horarios-section">
            <h2>Horarios Ocupados</h2>
            <div id="loading-horarios" class="loading">Cargando horarios...</div>
            <div id="horarios-container" class="horarios-container"></div>
        </section>

        <!-- Formulario de reserva -->
        <section class="form-section">
            <h2>Reservar Nueva Cita</h2>

            <div id="mensaje" class="mensaje"></div>

            <form id="form-cita">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">Número de WhatsApp *</label>
                    <input type="tel" id="whatsapp" name="whatsapp"
                           placeholder="Ej: 3001234567"
                           pattern="[0-9]{10,15}"
                           required>
                    <small>Solo números, sin espacios ni guiones</small>
                </div>

                <div class="form-group">
                    <label for="servicio">Tipo de Servicio *</label>
                    <select id="servicio" name="servicio" required>
                        <option value="">Seleccione un servicio</option>
                        <option value="Consulta Psicológica">Consulta Psicológica</option>
                        <option value="Terapia Individual">Terapia Individual</option>
                        <option value="Terapia de Pareja">Terapia de Pareja</option>
                        <option value="Terapia Familiar">Terapia Familiar</option>
                        <option value="Evaluación Psicológica">Evaluación Psicológica</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha">Fecha *</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora *</label>
                        <input type="time" id="hora" name="hora" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios"
                              rows="4"
                              placeholder="Información adicional que desee compartir"></textarea>
                </div>

                <button type="submit" id="btn-enviar">
                    <span class="btn-text">Reservar Cita</span>
                    <span class="btn-loader" style="display: none;">Procesando...</span>
                </button>
            </form>
        </section>
    </div>

    <footer>
        <p>Sistema de Reservas de Citas &copy; 2024</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
